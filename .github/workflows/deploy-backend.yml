name: Deploy Backend → AKS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/deploy-backend.yml'

env:
  RESOURCE_GROUP:   rg-nhi-alps-prod
  ACR_NAME:         ${{ secrets.ACR_NAME }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  IMAGE_NAME:       nhi-alps-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for Azure login
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push Docker image
        run: |
          IMAGE_TAG=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG ./backend
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group:  ${{ env.RESOURCE_GROUP }}
          cluster-name:    ${{ env.AKS_CLUSTER_NAME }}

      - name: Apply namespace & config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create configmap backend-config \
            --namespace nhi-alps \
            --from-literal=NODE_ENV=production \
            --from-literal=PORT=4000 \
            --from-literal=AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }} \
            --from-literal=AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update secrets
        run: |
          kubectl create secret generic backend-secrets \
            --namespace nhi-alps \
            --from-literal=DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Patch image & deploy
        run: |
          sed -i "s|PLACEHOLDER/nhi-alps-backend:latest|${{ env.IMAGE_TAG }}|g" k8s/backend/deployment.yaml
          kubectl apply -f k8s/backend/service.yaml
          kubectl apply -f k8s/backend/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/nhi-alps-backend -n nhi-alps --timeout=180s
