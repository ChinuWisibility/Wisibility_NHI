apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nhi-alps-ingress
  namespace: nhi-alps
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.nhi-alps.io        # replace with your domain
      secretName: nhi-alps-tls
  rules:
    - host: api.nhi-alps.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nhi-alps-backend
                port:
                  number: 80
