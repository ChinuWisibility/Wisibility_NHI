apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhi-alps-backend
  namespace: nhi-alps
  labels:
    app: nhi-alps-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nhi-alps-backend
  template:
    metadata:
      labels:
        app: nhi-alps-backend
    spec:
      containers:
        - name: backend
          # Replaced by GitHub Actions: <ACR_LOGIN_SERVER>/nhi-alps-backend:<GIT_SHA>
          image: PLACEHOLDER/nhi-alps-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu:    "250m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "512Mi"
      initContainers:
        - name: db-migrate
          image: PLACEHOLDER/nhi-alps-backend:latest
          command: ["npm", "run", "db:migrate"]
          envFrom:
            - secretRef:
                name: backend-secrets
