# or pulled from Azure Key Vault via the Secrets Store CSI driver.
#
# To create manually:
#   kubectl create secret generic backend-secrets \
#     --namespace nhi-alps \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db?sslmode=require' \
#     --from-literal=JWT_SECRET='your-secret-here'
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: nhi-alps
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  JWT_SECRET:   "REPLACE_ME"
